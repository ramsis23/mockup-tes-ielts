# Builds the Windows installer and macOS .dmg files.
# - Push a tag like v1.0.0  -> builds and publishes a GitHub Release with the installers.
# - Run manually (Actions tab -> Build desktop apps -> Run workflow) -> installers as downloadable artifacts.
name: Build desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest      # Apple Silicon (arm64)
          - os: macos-15-intel    # Intel (x86_64)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.0-dev"; fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: bash desktop/build-mac.sh "$APP_VERSION"

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: .\desktop\build-windows.ps1 -Version $env:APP_VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
