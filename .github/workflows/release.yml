# Builds the Windows installer, macOS .dmg files and the Android .apk.
# - Push a tag like v1.0.0  -> builds and publishes a GitHub Release with the installers.
# - Run manually (Actions tab -> Build desktop apps -> Run workflow) -> installers as downloadable artifacts.
name: Build desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest      # Apple Silicon (arm64)
          - os: macos-15-intel    # Intel (x86_64)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.0-dev"; fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: bash desktop/build-mac.sh "$APP_VERSION"

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: .\desktop\build-windows.ps1 -Version $env:APP_VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.0-dev"; fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Prepare web assets
        run: |
          npm ci --no-audit --no-fund
          node tools/build-web.mjs
          npx cap sync android

      # Optional: sign with your own key (repository secrets). Without them the APK is signed with a
      # throw-away debug key: it installs, but a later version will not install over it.
      - name: Release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - signing the APK with a debug key."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/IELTS-Practice-$APP_VERSION-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-android
          path: dist/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
